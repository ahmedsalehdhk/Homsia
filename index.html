<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Homsia has moved — homsiaproperties.com</title>
    <meta name="description" content="Homsia Properties has moved to homsiaproperties.com" />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://homsiaproperties.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111111;
        --muted: #6b6b6b;
        --hair: #e5e2dd;
        --bg: #fafaf7;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      .page {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: clamp(24px, 4vw, 44px);
      }
      header, footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .brand {
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        font-family: "Playfair Display", serif;
        font-size: 18px;
        letter-spacing: 0.01em;
      }
      .brand .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ink);
        transform: translateY(-2px);
      }
      .top-note, .foot-note {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        color: var(--muted);
      }
      .logo {
        display: block;
        height: 44px;
        width: auto;
      }
      main {
        display: grid;
        place-items: center;
        text-align: center;
        padding: 48px 0;
      }
      .content { max-width: 720px; }
      .rule {
        width: 40px;
        height: 1px;
        background: var(--ink);
        margin: 0 auto 28px;
        opacity: 0.6;
        animation: draw 900ms ease-out both;
      }
      .eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.32em;
        color: var(--muted);
        margin-bottom: 26px;
        animation: fade 900ms 120ms ease-out both;
      }
      h1 {
        font-family: "Playfair Display", serif;
        font-weight: 400;
        font-size: clamp(2.25rem, 6vw, 4rem);
        line-height: 1.1;
        margin: 0 0 32px;
        letter-spacing: -0.005em;
        animation: rise 900ms 200ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      h1 em {
        font-style: italic;
        font-weight: 400;
      }
      p.lede {
        margin: 0 auto 44px;
        color: var(--muted);
        font-size: clamp(1rem, 1.4vw, 1.075rem);
        line-height: 1.65;
        font-weight: 300;
        max-width: 46ch;
        animation: fade 900ms 320ms ease-out both;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-family: "Playfair Display", serif;
        font-style: italic;
        font-size: 1.05rem;
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid var(--ink);
        padding: 2px 2px 6px;
        transition: gap 200ms ease, opacity 200ms ease;
        animation: fade 900ms 440ms ease-out both;
      }
      .cta:hover { gap: 18px; opacity: 0.7; }
      .cta .arrow {
        display: inline-block;
        font-family: "Inter", sans-serif;
        font-style: normal;
      }
      footer {
        border-top: 1px solid var(--hair);
        padding-top: 20px;
        margin-top: 20px;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fade {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes draw {
        from { width: 0; opacity: 0; }
        to   { width: 40px; opacity: 0.6; }
      }
      @media (max-width: 520px) {
        header, footer { flex-direction: column; gap: 10px; text-align: center; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <span class="top-note">Est. Dhaka</span>
        <img class="logo" src="homsia-logo.png" alt="Homsia Properties Ltd" />
      </header>

      <main>
        <div class="content">
          <div class="rule" aria-hidden="true"></div>
          <div class="eyebrow">A new address</div>
          <h1>We have moved to <em>homsiaproperties.com</em></h1>
          <p class="lede">
            Same team. Same projects. A new home on the web —
            more of what we've been building, in one place.
          </p>
          <a class="cta" href="https://homsiaproperties.com/" rel="noopener">
            Continue to the new site
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </main>

      <footer>
        <span class="foot-note">© Homsia Properties Ltd.</span>
        <span class="foot-note">Please update your bookmarks</span>
      </footer>
    </div>
  </body>
</html>
